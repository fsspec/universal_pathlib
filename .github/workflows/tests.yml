name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_COLOR: "1"

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  tests:
    timeout-minutes: 10
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        pyv: ['3.9', '3.10', '3.11', '3.12', '3.13', '3.14', '3.15']
        session: ['tests']

        include:
          - os: ubuntu-latest
            pyv: '3.9'
            session: 'tests-minversion'

    steps:
    - name: Check out the repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        persist-credentials: false

    - uses: hynek/setup-cached-uv@v2

    - name: Run tests
      run: uvx nox --sessions ${{ matrix.session }} --python ${{ matrix.pyv }} -- --cov-report=

    - name: Upload coverage data
      if: ${{ !cancelled() }}
      uses: actions/upload-artifact@v4
      with:
        name: coverage-data-${{ matrix.os }}-${{ matrix.pyv }}-${{ matrix.session }}
        path: .coverage.*
        include-hidden-files: true
        if-no-files-found: ignore

  coverage:
    needs: tests
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest

    steps:
    - name: Check out the repository
      uses: actions/checkout@v4
      with:
        persist-credentials: false

    - uses: hynek/setup-cached-uv@v2

    - name: Download coverage data
      uses: actions/download-artifact@v4
      with:
        pattern: coverage-data-*
        merge-multiple: true

    - name: Combine coverage and report
      run: uvx nox --sessions coverage

    - name: Upload HTML report
      if: ${{ !cancelled() }}
      uses: actions/upload-artifact@v4
      with:
        name: coverage-html-report
        path: htmlcov

  typesafety:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        pyv: ['3.9', '3.10', '3.11', '3.12', '3.13', '3.14', '3.15']

    steps:
    - name: Check out the repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - uses: hynek/setup-cached-uv@v2

    - name: Run tests
      run: uvx nox --sessions type-safety --python ${{ matrix.pyv }}

  lint:
    runs-on: ubuntu-latest

    steps:
    - name: Check out the repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - uses: hynek/setup-cached-uv@v2

    - name: Lint code and check dependencies
      run: uvx nox -s lint

  build:
    needs: [tests, lint]
    runs-on: ubuntu-latest
    steps:
    - name: Check out the repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - uses: hynek/setup-cached-uv@v2

    - name: Build package
      run: uvx nox -s build
